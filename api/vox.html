<!DOCTYPE html><html>
<head><meta charset="utf-8"><script type="text/javascript" src="https://unpkg.com/voximplant-websdk@4.7.7-2788"></script></head>
<body>
    <script>
        (function () {
            const oldLog = console.log;
            console.log = function (...args) {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'console',
                    log: args
                }));
                oldLog.apply(console, args);
            };

            const oldWarn = console.warn;
            console.warn = function (...args) {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'warn',
                    log: args
                }));
                oldWarn.apply(console, args);
            };

            const oldError = console.error;
            console.error = function (...args) {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'error',
                    log: args
                }));
                oldError.apply(console, args);
            };
        })();

        let currentCall = null;
        const sdk = VoxImplant.getInstance();

        const init = async () => {
            try {
                await sdk.init({ showWarnings: false });
                console.log("Voximplant: SDK initialized.");
            } catch (e) {
                console.log("Voximplant: initialization error:", e);
            }
        };

        init();

        window.login = async (username, password) => {
            try {
                await sdk.connect();
                await sdk.login(username, password);
                console.log("Voximplant: logged in.");
            } catch (e) {
                if (e.code === 491) console.log("Voximplant: already logged in.");
                else console.log("Voximplant: login error: ", e);
            }
        };

        sdk.on(VoxImplant.Events.IncomingCall, (e) => {
            currentCall = e.call;

            window.ReactNativeWebView.postMessage(JSON.stringify({
                type: 'incomingCall',
                from: e.call.settings.displayName,
                username: e.call.settings.number.split("@")[0].slice(4)
            }));

            e.call.on(VoxImplant.CallEvents.Connected, () => {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'CallConnected'
                }));
            });

            e.call.on(VoxImplant.CallEvents.Disconnected, () => {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'CallDisconnected'
                }));
                currentCall = null;
            });

            e.call.on(VoxImplant.CallEvents.Failed, (i) => {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'CallFailed'
                }));
                console.log("Voximplant: call failed: " + i);
                currentCall = null;
            });
        });

        window.startCall = function (username) {
            console.log("Voximplant: calling " + username);
            const call = sdk.call({ number: username });
            currentCall = call;

            call.on(VoxImplant.CallEvents.Connected, () => {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'CallConnected'
                }));
            });

            call.on(VoxImplant.CallEvents.Disconnected, () => {
                window.ReactNativeWebView.postMessage(JSON.stringify({
                    type: 'CallDisconnected'
                }));
                currentCall = null;
            });

            call.on(VoxImplant.CallEvents.Failed, (e) => {
                console.log("Voximplant: call failed with error code " + e.code + " reason " + e.reason);
                if (e.code === 403) {
                    window.ReactNativeWebView.postMessage(JSON.stringify({
                        type: 'CallError',
                        message: 'Нет доступа к микрофону!'
                    }));
                } else if (e.code === 480) {
                    window.ReactNativeWebView.postMessage(JSON.stringify({
                        type: 'CallError',
                        message: 'Пользователь не в сети!'
                    }));
                } else if (e.code === 603) {
                    window.ReactNativeWebView.postMessage(JSON.stringify({
                        type: 'CallError',
                        message: 'Пользователь отклонил звонок!'
                    }));
                } else if (e.reason === "1003") {
                    window.ReactNativeWebView.postMessage(JSON.stringify({
                        type: 'ConnectionError'
                    }));
                } else {
                    window.ReactNativeWebView.postMessage(JSON.stringify({
                        type: 'CallFailed',
                        error: e.code
                    }));
                }
            });
        };

        window.answerCall = function () {
            currentCall.answer();
            console.log("Voximplant: call answered.");
        };

        window.declineCall = function () {
            currentCall.decline();
            currentCall = null;
            console.log("Voximplant: call declined.");
        };

        window.hangupCall = function () {
            currentCall.hangup();
            currentCall = null;
            console.log("Voximplant: call hung up.");
        };
    </script>
</body>
</html>
