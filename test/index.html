<!DOCTYPE html>
<html>
<head>
    <title>Тест P2P звонков</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script type="text/javascript" src="https://unpkg.com/voximplant-websdk@4.7.7-2788"></script>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: black;
            color: rgb(0, 150, 0);
            font-size: 20px;
        }

        input {
            font-family: 'Courier New', Courier, monospace;
            background-color: black;
            color: rgb(0, 150, 0);
            font-size: 20px;
            padding: 5px 10px;
            border: 1px solid rgb(0, 150, 0);
        }

        button {
            font-family: 'Courier New', Courier, monospace;
            background-color: black;
            color: rgb(0, 150, 0);
            font-size: 20px;
            padding: 5px 10px;
            border: 1px solid rgb(0, 150, 0);
        }
    </style>
</head>
<body>
    <p id="status">Тест P2P звонков</p>

    <div id="loginform">
        <p>Логин:</p>
        <input id="username" type="text">
        <p>Пароль:</p>
        <input id="password" type="password">
        <br><br>
        <button onclick="login()">Войти</button>
    </div>

    <div id="callform" style="display: none;">
        <p>Кому позвонить:</p>
        <input id="number" type="text">
        <br><br>
        <button onclick="startcall()">Позвонить</button>
    </div>

    <div id="incoming" style="display: none;">
        <button id="answer">Ответить</button>
        <button id="decline">Отклонить</button>
    </div>

    <div id="during" style="display: none;">
        <button id="hangup">Завершить вызов</button>
    </div>

    <button onclick="location.reload()" id="reload" style="display: none;">Заново</button>

    <script>
        const sdk = VoxImplant.getInstance();

        const login = async () => {
            try {
                document.getElementById("status").innerHTML = "Запуск SDK...";
                await sdk.init({ showWarnings: false });
                document.getElementById("status").innerHTML = "Подключение к серверу...";
                await sdk.connect();
                document.getElementById("status").innerHTML = "Проверка пароля...";
                await sdk.login(
                    "dean_of_snakes-mail.ru@nevka.avicus.n4.voximplant.com", "PASTE_VOX_PASSWORD_HERE"
                    // document.getElementById("username").value + "@p2ptest.avicus.n4.voximplant.com",
                    // document.getElementById("password").value
                );

                // document.getElementById("status").innerHTML = "Успешный вход!";
                document.getElementById("status").innerHTML = "Вы вошли, как Татьяна Спицына!";
                document.getElementById("callform").style.display = "block";
                document.getElementById("loginform").style.display = "none";
            } catch (e) {
                if (e.code === 401) document.getElementById("status").innerHTML = "Неправильный пароль!";
                else if (e.code === 404) document.getElementById("status").innerHTML = "Пользователь не существует!";
                else document.getElementById("status").innerHTML = "Ошибка входа!";
                document.getElementById("loginform").style.display = "none";
                document.getElementById("reload").style.display = "block";
            }
        };

        login();
        document.getElementById("number").value = "avicus-ya.ru@nevka.avicus.n4.voximplant.com";

        const startcall = () => {
            const call = sdk.call({ number: document.getElementById("number").value });
            document.getElementById("status").innerHTML = "Вызов...";

            document.getElementById("hangup").onclick = () => {
                call.hangup();
                document.getElementById("during").style.display = "none";
                document.getElementById("callform").style.display = "block";
            };

            call.addEventListener(VoxImplant.CallEvents.Connected, () => {
                document.getElementById("status").innerHTML = "Подключение установлено!";
                document.getElementById("callform").style.display = "none";
                document.getElementById("during").style.display = "block";
            });

            call.addEventListener(VoxImplant.CallEvents.Disconnected, () => {
                document.getElementById("status").innerHTML = "Вызов завершён!";
                document.getElementById("callform").style.display = "block";
                document.getElementById("during").style.display = "none";
            });

            call.addEventListener(VoxImplant.CallEvents.Failed, (e) => {
                if (e.code === 404) document.getElementById("status").innerHTML = "Пользователь не существует!";
                else if (e.code === 403) document.getElementById("status").innerHTML = "Нет доступа к микрофону!";
                else if (e.code === 480) document.getElementById("status").innerHTML = "Пользователь не в сети!";
                else if (e.code === 603) document.getElementById("status").innerHTML = "Пользователь отклонил звонок!";
                else console.log(e);
            });
        };

        sdk.on(VoxImplant.Events.IncomingCall, (e) => {
            document.getElementById("status").innerHTML = "Вам звонит " + e.call.settings.displayName;
            document.getElementById("callform").style.display = "none";
            document.getElementById("incoming").style.display = "block";

            let voxUsername = e.call.settings.number.split("@")[0].slice(4);
            console.log("Входящий звонок от пользователя: " + voxUsername);

            document.getElementById("answer").onclick = () => {
                e.call.answer();
                document.getElementById("during").style.display = "block";
                document.getElementById("incoming").style.display = "none";
            };

            document.getElementById("decline").onclick = () => {
                e.call.decline();
                document.getElementById("status").innerHTML = "Вы отклонили вызов!";
                document.getElementById("callform").style.display = "block";
                document.getElementById("incoming").style.display = "none";
            };

            document.getElementById("hangup").onclick = () => {
                e.call.hangup();
                document.getElementById("during").style.display = "none";
                document.getElementById("callform").style.display = "block";
            };

            e.call.addEventListener(VoxImplant.CallEvents.Connected, () => {
                document.getElementById("status").innerHTML = "Подключение установлено!";
            });

            e.call.addEventListener(VoxImplant.CallEvents.Disconnected, () => {
                document.getElementById("status").innerHTML = "Вызов завершён!";
                document.getElementById("callform").style.display = "block";
                document.getElementById("during").style.display = "none";
            });
        });

        // Сценарий в приложении на стороне https://manage.voximplant.com/

        // VoxEngine.addEventListener(AppEvents.CallAlerting, (e) => {
        //     const newCall = VoxEngine.callUserDirect(
        //         e.call,
        //         e.destination,
        //         {
        //             displayName: e.displayName,
        //             callerid: e.callerid,
        //         }
        //     );
        //     VoxEngine.easyProcess(e.call, newCall, () => {}, true);
        // });
    </script>
</body>

</html>
